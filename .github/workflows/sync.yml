name: Sync Lucide upstream

on:
  schedule:
    # Check the upstream Lucide repository every 12 hours.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lucide-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Moe branch and submodule
        uses: actions/checkout@v4
        with:
          ref: Moe
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find latest upstream tag
        id: upstream
        shell: bash
        run: |
          cd lucide
          git remote set-url origin https://github.com/lucide-icons/lucide.git
          git fetch --tags origin

          current_commit="$(git rev-parse HEAD)"
          latest_tag="$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:strip=2)' refs/tags)"
          latest_commit="$(git rev-list -n 1 "$latest_tag")"

          echo "Current commit: $current_commit"
          echo "Latest tag: $latest_tag"
          echo "Latest commit: $latest_commit"

          if [ "$current_commit" = "$latest_commit" ] || git merge-base --is-ancestor "$latest_commit" "$current_commit"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$latest_commit" >> "$GITHUB_OUTPUT"

      - name: Update submodule
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git -C lucide checkout --quiet "${{ steps.upstream.outputs.tag }}"
          git add lucide
          git commit -m "chore: update lucide submodule to ${{ steps.upstream.outputs.tag }}"

      - name: Push update and release tag
        if: steps.upstream.outputs.changed == 'true'
        run: |
          release_tag="${{ steps.upstream.outputs.tag }}"

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tagged_submodule_commit="$(git ls-tree "$release_tag" lucide | awk '{print $3}')"
            if [ "$tagged_submodule_commit" != "${{ steps.upstream.outputs.commit }}" ]; then
              echo "Tag $release_tag already exists but points to a different Lucide commit." >&2
              exit 1
            fi
            echo "Tag $release_tag already exists; skipping tag creation."
            tag_exists=true
          else
            git tag -a "$release_tag" -m "Update to lucide $release_tag"
            tag_exists=false
          fi

          git push origin Moe
          if [ "$tag_exists" = false ]; then
            git push origin "$release_tag"
          fi
